---
- name: Install baseline packages
  ansible.builtin.package:
    name:
      - curl
    state: present

- name: Ensure motd.d exists
  ansible.builtin.file:
    path: /etc/motd.d
    state: directory
    mode: "0755"

- name: Announce that this host is managed by Ansible
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd.d/9999-ansible-managed
    mode: "0644"

- name: Install ansible-pull service
  ansible.builtin.template:
    src: ansible-pull.service.j2
    dest: /etc/systemd/system/ansible-pull.service
    mode: "0644"

- name: Install ansible-pull timer
  ansible.builtin.template:
    src: ansible-pull.timer.j2
    dest: /etc/systemd/system/ansible-pull.timer
    mode: "0644"

- name: Enable and start ansible-pull timer
  ansible.builtin.systemd:
    name: ansible-pull.timer
    enabled: true
    state: started
    daemon_reload: true
