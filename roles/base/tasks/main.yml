---
- name: Install baseline packages
  ansible.builtin.package:
    name:
      - curl
    state: present

- name: Ensure motd.d exists
  ansible.builtin.file:
    path: /etc/motd.d
    state: directory
    mode: "0755"

- name: Announce that this host is managed by Ansible
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd.d/9999-ansible-managed
    mode: "0644"

